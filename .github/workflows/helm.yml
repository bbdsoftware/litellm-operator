name: Build and Publish Helm Chart

# This workflow handles:
# 1. Linting and testing Helm charts on PRs
# 2. Publishing Helm charts to OCI registry on releases
# 3. Only publishes when a release is created (not on PR merges)

on:
  push:
    branches: [ main ]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
      - "config/crd/**"
  pull_request:
    branches: [ main ]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
      - "config/crd/**"
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Lint Helm chart
      run: |
        helm lint helm/
        helm template litellm-operator helm/ > /dev/null

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Validate Helm chart
      run: |
        # Render templates to validate they work correctly
        helm template litellm-operator helm/ --dry-run
        # Test with different values to ensure templates are robust
        helm template litellm-operator helm/ --dry-run --set replicaCount=3
        helm template litellm-operator helm/ --dry-run --set image.tag=latest

  publish-oci:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify chart version
      run: |
        # Extract version from release tag (remove 'v' prefix)
        RELEASE_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Release version: $RELEASE_VERSION"
        
        # Get chart version from Chart.yaml
        CHART_VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
        echo "Chart version: $CHART_VERSION"
        
        # Verify versions match
        if [ "$CHART_VERSION" != "$RELEASE_VERSION" ]; then
          echo "❌ Chart version ($CHART_VERSION) doesn't match release version ($RELEASE_VERSION)"
          echo "This usually means the PR from the release workflow hasn't been merged yet."
          exit 1
        fi
        
        echo "✅ Chart version matches release version"

    - name: Package and push Helm chart to OCI registry
      run: |
        # Extract version from release tag (remove 'v' prefix)
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Publishing chart version $VERSION to GitHub Packages"
        
        # Package the chart first
        helm package helm/
        
        # Push the packaged chart to GitHub Container Registry
        helm push litellm-operator-$VERSION.tgz oci://ghcr.io/bbd/charts
        
        echo "Successfully pushed litellm-operator-$VERSION.tgz to ghcr.io/bbd/charts" 