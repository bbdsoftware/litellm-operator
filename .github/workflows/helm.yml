name: Build and Publish Helm Chart

on:
  push:
    branches: [ main ]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
      - "config/crd/**"
  pull_request:
    branches: [ main ]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
      - "config/crd/**"
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Lint Helm chart
      run: |
        helm lint helm/
        helm template litellm-operator helm/ > /dev/null

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Validate Helm chart
      run: |
        # Render templates to validate they work correctly
        helm template litellm-operator helm/ --dry-run
        # Test with different values to ensure templates are robust
        helm template litellm-operator helm/ --dry-run --set replicaCount=3
        helm template litellm-operator helm/ --dry-run --set image.tag=latest

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Update chart version
      run: |
        # Extract version from release tag (remove 'v' prefix)
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Updating chart version to $VERSION"
        
        # Update Chart.yaml
        sed -i "s/^version: .*/version: $VERSION/" helm/Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" helm/Chart.yaml
        
        # Update image tag in values.yaml
        sed -i "s/^    tag: .*/    tag: \"$VERSION\"/" helm/values.yaml

    - name: Package Helm chart
      run: |
        helm package helm/
        mv litellm-operator-*.tgz dist/

    - name: Create Helm repository
      run: |
        mkdir -p docs/charts
        helm repo index docs/charts --url https://bbd.github.io/litellm-operator/charts
        cp dist/*.tgz docs/charts/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs

  publish-oci:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.12.0

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Update chart version
      run: |
        # Extract version from release tag (remove 'v' prefix)
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Updating chart version to $VERSION"
        
        # Update Chart.yaml
        sed -i "s/^version: .*/version: $VERSION/" helm/Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" helm/Chart.yaml
        
        # Update image tag in values.yaml
        sed -i "s/^    tag: .*/    tag: \"$VERSION\"/" helm/values.yaml

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Helm chart to OCI registry
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        helm push helm/ oci://ghcr.io/bbd/charts 