name: Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Check for changes in last 24 hours
      id: changes
      run: |
        # Check if there are any commits in the last 24 hours
        COMMITS=$(git rev-list --count --since="24 hours ago" HEAD)
        if [ "$COMMITS" -gt 0 ] || [ "${{ github.event.inputs.force_run }}" == "true" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Found $COMMITS commits in the last 24 hours"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No commits found in the last 24 hours"
        fi

  nightly-build:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        driver-opts: |
          image=moby/buildkit:v0.12.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Generate nightly version
      id: version
      run: |
        # Generate nightly version: v0.0.0-nightly.YYYYMMDD.COMMIT
        DATE=$(date +%Y%m%d)
        COMMIT=$(git rev-parse --short HEAD)
        VERSION="v0.0.0-nightly.${DATE}.${COMMIT}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated nightly version: $VERSION"

    - name: Run GoReleaser (Nightly)
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --snapshot --clean --config .goreleaser.nightly.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        DOCKER_BUILDKIT: 1
        NIGHTLY_VERSION: ${{ steps.version.outputs.version }}

    - name: Clean up old nightly releases
      uses: actions/github-script@v7
      with:
        script: |
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const nightlyReleases = releases.data.filter(release => 
            release.tag_name.includes('nightly') && 
            release.prerelease
          );
          
          // Keep last 7 nightly releases, delete older ones
          const toDelete = nightlyReleases.slice(7);
          
          for (const release of toDelete) {
            console.log(`Deleting old nightly release: ${release.tag_name}`);
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              
              // Also delete the tag
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${release.tag_name}`
              });
            } catch (error) {
              console.log(`Failed to delete ${release.tag_name}: ${error.message}`);
            }
          } 