name: Release

on:
  push:
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    # disable this job for now
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Run tests
      run: make test

    - name: Run linting
      uses: golangci/golangci-lint-action@v8.0.0
      with:
        version: latest

  goreleaser:
    # needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        driver-opts: |
          image=moby/buildkit:v0.12.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}



    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Cache Helm charts
      uses: actions/cache@v4
      with:
        path: ~/.cache/helm
        key: ${{ runner.os }}-helm-${{ hashFiles('helm/Chart.yaml') }}
        restore-keys: |
          ${{ runner.os }}-helm-

    - name: Generate CRDs
      run: |
        # Generate CRDs
        make generate manifests
        
        # Create combined CRD file
        mkdir -p dist
        cat config/crd/bases/*.yaml > dist/crds.yaml
      env:
        GOOS: linux
        GOARCH: amd64

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        DOCKER_BUILDKIT: 1

    - name: Wait for images to be available
      run: |
        # Wait for the manifest images to be available in the registry
        echo "Waiting for container images to be available..."
        max_attempts=30
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt/$max_attempts: Checking for image ghcr.io/${{ github.repository_owner }}/litellm-operator:${{ github.ref_name }}"
          
          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/litellm-operator:${{ github.ref_name }} >/dev/null 2>&1; then
            echo "✅ Image ghcr.io/${{ github.repository_owner }}/litellm-operator:${{ github.ref_name }} is available"
            break
          fi
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Image not available after $max_attempts attempts"
            exit 1
          fi
          
          echo "⏳ Image not ready yet, waiting 10 seconds..."
          sleep 10
          attempt=$((attempt + 1))
        done
        
        # Also check for latest tag
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt/$max_attempts: Checking for image ghcr.io/${{ github.repository_owner }}/litellm-operator:latest"
          
          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/litellm-operator:latest >/dev/null 2>&1; then
            echo "✅ Image ghcr.io/${{ github.repository_owner }}/litellm-operator:latest is available"
            break
          fi
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Latest image not available after $max_attempts attempts"
            exit 1
          fi
          
          echo "⏳ Latest image not ready yet, waiting 10 seconds..."
          sleep 10
          attempt=$((attempt + 1))
        done

    - name: Sign container images
      run: |
        # Sign the container images using digests for better security
        echo "Signing versioned image..."
        VERSION_DIGEST=$(docker manifest inspect ghcr.io/${{ github.repository_owner }}/litellm-operator:${{ github.ref_name }} | jq -r '.config.digest')
        cosign sign --yes ghcr.io/${{ github.repository_owner }}/litellm-operator@$VERSION_DIGEST
        
        echo "Signing latest image..."
        LATEST_DIGEST=$(docker manifest inspect ghcr.io/${{ github.repository_owner }}/litellm-operator:latest | jq -r '.config.digest')
        cosign sign --yes ghcr.io/${{ github.repository_owner }}/litellm-operator@$LATEST_DIGEST
        
        # Also sign the tag-based references for backward compatibility
        echo "Signing tag-based references..."
        cosign sign --yes ghcr.io/${{ github.repository_owner }}/litellm-operator:${{ github.ref_name }}
        cosign sign --yes ghcr.io/${{ github.repository_owner }}/litellm-operator:latest
      env:
        COSIGN_EXPERIMENTAL: 1

  update-manifests:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') }}
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main

    - name: Update operator image in manifests
      run: |
        # Extract version from tag (remove 'v' prefix)
        VERSION=${GITHUB_REF#refs/tags/v}
        
        # Update the default kustomization to use the new image
        cd config/manager
        kustomize edit set image controller=ghcr.io/${{ github.repository_owner }}/litellm-operator:${{ github.ref_name }}
        cd ../..
        
        # Update Helm chart version and appVersion
        sed -i "s/^version: .*/version: $VERSION/" helm/Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" helm/Chart.yaml
        
        # Update default image tag in values.yaml
        sed -i "s/^    tag: .*/    tag: \"$VERSION\"/" helm/values.yaml
        
        # Commit the changes
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "chore: update operator image and helm chart to ${{ github.ref_name }}"
        git push
      env:
        GITHUB_REF: ${{ github.ref }} 